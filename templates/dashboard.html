<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Dashboard</title>
    <style>
        /* CSS Reset and Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        /* Container Layout */
        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Header & Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        
        h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .back-link {
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 5px;
            background-color: #e7f1ff;
            transition: background-color 0.2s;
        }

        .back-link:hover {
            background-color: #cce5ff;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
            transition: background-color 0.2s ease;
        }

        /* Column Specifics */
        .id-col { width: 5%; font-weight: bold; color: #6c757d; }
        .file-col { width: 25%; font-weight: 600; color: #2c3e50; }
        .result-col {
            width: 60%;
            white-space: pre-wrap; 
            font-family: monospace;
            font-size: 14px;
            color: #444;
            background-color: #fdfdfd;
        }
        .action-col { width: 10%; text-align: center; }

        /* Delete Button Styling */
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Candidate History</h1>
            <a href="/" class="back-link">&larr; Back to Scanner</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Resume File</th>
                    <th>Scan Results</th>
                    <th style="text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for candidate in candidates %}
                <tr>
                    <td class="id-col">#{{ candidate.id }}</td>
                    <td class="file-col">{{ candidate.filename }}</td>
                    <td class="result-col">{{ candidate.scan_result }}</td>
                    <td class="action-col">
                        <!-- Delete Form -->
                        <form action="/delete/{{ candidate.id }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this candidate?');">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="empty-state">No resumes have been scanned yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
