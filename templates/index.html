<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screening Tool | ATS</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
        }

        /* Top Nav Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-nav h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 22px;
        }

        .dashboard-btn {
            text-decoration: none;
            background-color: #ffffff;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .dashboard-btn:hover {
            background-color: var(--primary);
            color: #ffffff;
        }

        /* Card Box */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 35px;
            margin-bottom: 30px;
        }

        .card h1 {
            margin-top: 0;
            color: #111827;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #374151;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus, input[type="file"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .file-drop-area {
            border: 2px dashed var(--border-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background-color: #fafafa;
            transition: border-color 0.2s;
        }

        .file-drop-area:hover {
            border-color: var(--primary);
        }

        input[type="file"] {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Submit Button */
        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Results Section */
        .results-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 35px;
            border-left: 5px solid var(--primary);
        }

        .results-card h3 {
            margin-top: 0;
            color: #111827;
            font-size: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .ai-output {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13.5px;
            color: #334155;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <h2>AI ATS System</h2>
            <a href="/dashboard" class="dashboard-btn">View Candidate Database &rarr;</a>
        </div>

        <!-- Main Input Card -->
        <div class="card">
            <h1>Resume Screening & Matching</h1>
            <p class="subtitle">Paste any job description and upload a candidate PDF resume for instant AI contextual evaluation.</p>
            
            <form action="/" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="job_description">Job Description / Required Skills:</label>
                    <textarea name="job_description" rows="5" placeholder="Paste role requirements here (e.g., Looking for a Python Developer with Flask, REST APIs, and SQL experience...)"></textarea>
                </div>

                <div class="form-group">
                    <label for="resume_file">Upload Candidate Resume (PDF):</label>
                    <div class="file-drop-area">
                        <input type="file" name="resume_file" accept=".pdf" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Run AI Resume Evaluation</button>
            </form>
        </div>

        <!-- Dynamic Results Card -->
        {% if result %}
        <div class="results-card">
            <h3>AI Evaluation Report</h3>
            <div class="ai-output">{{ result }}</div>
        </div>
        {% endif %}
    </div>

</body>
</html>
